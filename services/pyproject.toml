[project]
name = "ourfos-services"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk[gcp]==2.10.0",
    "google-auth[requests]",
    "google-cloud-firestore>=2.32.0",
    "mifos-connector",
    "pillow>=12.3.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "google-adk[eval]==2.10.0",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = [".", "../agents"]

[tool.uv.sources]
mifos-connector = { git = "ssh://git@github.com/tinopetros/mifos-connector-py.git", tag = "0.0.0" }
