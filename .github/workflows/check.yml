name: check

# `make check` on every pull request, and on main for direct pushes. No GCP credentials needed

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@v10.2.0 # no major tag published
      - run: make check
