name: check

# `make check` on every pull request, and on main for direct pushes. No GCP credentials needed, only the connector's token

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Its token is for this repo only, and would be sent to the connector's too
          persist-credentials: false
      # The connector is private: a read-only token for it, in place of ssh (docs/phase11/tdd.md, step 1)
      - run: git config --global url."https://x-access-token:${MIFOS_CONNECTOR_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
        env:
          MIFOS_CONNECTOR_TOKEN: ${{ secrets.MIFOS_CONNECTOR_TOKEN }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@v10.2.0 # no major tag published
      # The UI's checks, and its types against the API's (docs/phase13/tdd.md, step 4)
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make check
