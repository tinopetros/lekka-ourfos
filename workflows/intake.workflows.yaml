# Any form that's only received and acknowledged, for now: the vehicle log, the loan approval request and the
# write-off request (docs/phase10/tdd.md). Its plumbing is lib.workflows.yaml's, which Terraform puts under this

main:
  params: [args]
  steps:
    - init:
        assign:
          - submission: ${args.submission}
          # Tells only lekkai@ and the submitter (docs/release1/adr.md 3)
          - test: ${default(map.get(args, "test"), false)}
          - simulate: {}
          # The submission's document
          - at: '${"/forms/" + args.form + "/" + args.id}'
    - allow_simulate:
        switch:
          # Dev only. In prod a fixture's simulate is ignored, so the run is a real one
          - condition: ${sys.get_env("SIMULATE") == "on"}
            assign:
              - simulate: ${default(map.get(args, "simulate"), simulate)}
    - log_start:
        call: sys.log
        args:
          severity: INFO
          json: { message: "intake started", execution_id: '${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}', at: '${at}', response_number: '${args.submission.response_number}' }
    - run:
        try:
          call: process
          args:
            at: ${at}
            submission: ${submission}
            test: ${test}
            simulate: ${simulate}
          result: result
        except:
          as: e
          steps:
            - failed:
                call: complete
                args:
                  at: ${at}
                  result: { status: "failed", reason: '${default(map.get(e, "message"), json.encode_to_string(e))}' }
            - fail:
                raise: ${e}
    - complete:
        call: complete
        args:
          at: ${at}
          result: ${result}
    - done:
        return: ${result}

# Received, then the first email: done. Anything else hands over
process:
  params: [at, submission, test, simulate]
  steps:
    - init:
        assign:
          - thread: null
    - run:
        try:
          steps:
            - receive:
                try:
                  call: call_service
                  args:
                    at: ${at}
                    method: POST
                    path: ""
                    body:
                      submission: ${submission}
                      test: ${test}
                      simulate: ${simulate}
                      workflow: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_ID")}
                      revision: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_REVISION_ID")}
                retry:
                  predicate: ${is_retryable_read}
                  max_retries: 3
                  backoff: { initial_delay: 2, max_delay: 30, multiplier: 2 }
            - acknowledge:
                try:
                  call: call_service
                  args:
                    at: ${at}
                    method: POST
                    path: /acknowledge
                    body:
                      simulate: ${map.get(simulate, "acknowledge")}
                  result: thread
                retry:
                  predicate: ${is_transient}
                  max_retries: 3
                  backoff: { initial_delay: 2, max_delay: 30, multiplier: 2 }
            - done:
                return: { status: "done" }
        except:
          as: e
          steps:
            - handover:
                call: handover
                args:
                  at: ${at}
                  e: ${e}
                  thread: ${thread}
                  submission: ${submission}
                  test: ${test}
                  code: ${map.get(simulate, "handover")}
                result: reason
            - handed_over:
                return: { status: "handed_over", reason: "${reason}" }
