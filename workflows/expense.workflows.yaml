# A requisition, from the form to Mifos, in one thread of emails (docs/phase9/tdd.md). Its plumbing is
# lib.workflows.yaml's, which Terraform puts under this

main:
  params: [args]
  steps:
    - init:
        assign:
          # Null when the trigger couldn't clean the form: invalid says why, and the run only hands over
          - requisition: ${default(map.get(args, "submission"), null)}
          - invalid: ${default(map.get(args, "invalid"), null)}
          # The form's payload as posted, beside the clean one while the cleaner is new (phase 5 ADR 2)
          - raw: ${default(map.get(args, "raw"), null)}
          # Tells only lekkai@ and the submitter (docs/release1/adr.md 3)
          - test: ${default(map.get(args, "test"), false)}
          # Off: nothing goes to Mifos and there's no last email, as on a test run (docs/phase12/adr.md 8)
          - mifos: ${default(map.get(args, "mifos"), true)}
          - simulate: {}
          # The submission's document: its response_id, or this run's own id when the form couldn't give one
          - at: '${"/forms/" + args.form + "/" + default(map.get(args, "id"), sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID"))}'
    - allow_simulate:
        switch:
          # Dev only. In prod a fixture's simulate is ignored, so the run is a real one
          - condition: ${sys.get_env("SIMULATE") == "on"}
            assign:
              - simulate: ${default(map.get(args, "simulate"), simulate)}
    # map.get, not if(): Workflows evaluates both of if()'s branches, so a null requisition's lookup still runs
    - log_start:
        call: sys.log
        args:
          severity: INFO
          json: { message: "requisition started", execution_id: '${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}', at: '${at}', response_number: '${map.get(args, ["submission", "response_number"])}' }
    - run:
        try:
          call: process
          args:
            at: ${at}
            requisition: ${requisition}
            invalid: ${invalid}
            raw: ${raw}
            test: ${test}
            mifos: ${mifos}
            simulate: ${simulate}
          result: result
        except:
          as: e
          steps:
            - failed:
                call: complete
                args:
                  at: ${at}
                  result: { status: "failed", reason: '${default(map.get(e, "message"), json.encode_to_string(e))}' }
            - fail:
                raise: ${e}
    - complete:
        call: complete
        args:
          at: ${at}
          result: ${result}
    - done:
        return: ${result}

# Every step, and how it ends: done, rejected or handed over. Only a failed handover raises
process:
  params: [at, requisition, invalid, raw, test, mifos, simulate]
  steps:
    - init:
        assign:
          - execution_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
          - thread: null
          # Stays null on a test run, or with Mifos off: neither posts
          - mifos_transaction_id: null
    - run:
        try:
          steps:
            - cleaned:
                switch:
                  - condition: ${requisition == null}
                    raise: { tags: [Invalid], message: '${"The form could not be read: " + invalid}' }
            - receive:
                try:
                  call: call_service
                  args:
                    at: ${at}
                    method: POST
                    path: ""
                    body:
                      submission: ${requisition}
                      raw: ${raw}
                      test: ${test}
                      mifos: ${mifos}
                      simulate: ${simulate}
                      workflow: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_ID")}
                      revision: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_REVISION_ID")}
                retry:
                  predicate: ${is_retryable_read}
                  max_retries: 3
                  backoff: { initial_delay: 2, max_delay: 30, multiplier: 2 }
            # The first email. Every other one replies in its thread
            - acknowledge:
                try:
                  call: call_service
                  args:
                    at: ${at}
                    method: POST
                    path: /acknowledge
                    body:
                      simulate: ${map.get(simulate, "acknowledge")}
                  result: thread
                retry:
                  predicate: ${is_transient}
                  max_retries: 3
                  backoff: { initial_delay: 2, max_delay: 30, multiplier: 2 }
            - classify:
                try:
                  call: call_service
                  args:
                    at: ${at}
                    method: POST
                    path: /classify
                    body:
                      simulate: ${map.get(simulate, "classify")}
                    # A real model call can take 40s, and fetching and screening the files adds to it.
                    # Fewer, longer attempts: each one costs
                    timeout: 120
                  result: classification
                retry:
                  predicate: ${is_retryable_read}
                  max_retries: 2
                  backoff: { initial_delay: 4, max_delay: 30, multiplier: 4 }
            - check:
                call: check
                args:
                  c: ${classification}
                  amount: ${requisition.amount}
            - suggest:
                try:
                  call: call_service
                  args:
                    at: ${at}
                    method: POST
                    path: /suggest
                    body:
                      thread: ${thread}
                      simulate: ${map.get(simulate, "suggest")}
                retry:
                  predicate: ${is_transient}
                  max_retries: 3
                  backoff: { initial_delay: 2, max_delay: 30, multiplier: 2 }
            - rejected:
                switch:
                  - condition: ${not classification.approve}
                    return: { status: "rejected", reason: "${classification.reason}" }
            - post:
                call: post
                args:
                  at: ${at}
                  run: ${execution_id}
                  code: ${map.get(simulate, "mifos_post")}
                result: posted
            # A test run, or Mifos off: nothing posted, so nothing to confirm
            - posted:
                switch:
                  - condition: ${map.get(posted, "skipped") != null}
                    return: { status: "done", skipped: "${posted.skipped}" }
            # Mifos's transaction id is the proof: it isn't read back, since its reads take minutes
            # (docs/phase12/adr.md 11)
            - transaction:
                assign:
                  - mifos_transaction_id: ${posted.mifos_transaction_id}
            - confirm:
                try:
                  call: call_service
                  args:
                    at: ${at}
                    method: POST
                    path: /confirm
                    body:
                      mifos_transaction_id: ${mifos_transaction_id}
                      thread: ${thread}
                      simulate: ${map.get(simulate, "confirm")}
                retry:
                  predicate: ${is_transient}
                  max_retries: 3
                  backoff: { initial_delay: 2, max_delay: 30, multiplier: 2 }
            - done:
                return: { status: "done", mifos_transaction_id: "${mifos_transaction_id}" }
        except:
          as: e
          steps:
            - handover:
                call: handover
                args:
                  at: ${at}
                  e: ${e}
                  thread: ${thread}
                  submission: ${requisition}
                  raw: ${raw}
                  test: ${test}
                  code: ${map.get(simulate, "handover")}
                result: reason
            - handed_over:
                return: { status: "handed_over", reason: "${reason}" }

# Approved, balanced and adding up to the amount, or rejected with a reason. Anything else is ours to hand over
check:
  params: [c, amount]
  steps:
    - rejected:
        switch:
          - condition: ${not c.approve and default(map.get(c, "reason"), "") != ""}
            return: ok
          - condition: ${not c.approve}
            raise: { tags: [CheckFailed], message: "Rejected without a reason" }
          - condition: ${len(c.debit) == 0}
            raise: { tags: [CheckFailed], message: "Approved with no entries" }
    - init:
        assign:
          - debits: 0
          - credits: 0
    - sum_debits:
        for:
          value: line
          in: ${c.debit}
          steps:
            - add_debit:
                assign:
                  - debits: ${debits + line.amount}
    - sum_credits:
        for:
          value: line
          in: ${c.credit}
          steps:
            - add_credit:
                assign:
                  - credits: ${credits + line.amount}
    - balanced:
        switch:
          - condition: ${math.abs(debits - credits) > 0.005}
            raise:
              tags: [CheckFailed]
              message: ${"Debits (" + string(debits) + ") and credits (" + string(credits) + ") do not balance"}
          # A cent either way, since the NSSA split rounds each half up. The rest is float noise
          - condition: ${math.abs(debits - amount) > 0.011}
            raise:
              tags: [CheckFailed]
              message: ${"Debits (" + string(debits) + ") do not add up to the requisition's " + string(amount)}
    - ok:
        return: ok
