# Mifos into our record, one kind a run: each night from Cloud Scheduler, or by hand with from for the preload
# (docs/phase12/tdd.md, steps 6 and 7). Its plumbing is lib.workflows.yaml's. Every step only adds, so every
# failure is safe to retry

main:
  params: [args]
  steps:
    - call:
        try:
          call: call_service
          args:
            at: ${"/sync/" + args.kind}
            method: POST
            path: ""
            body:
              from: ${map.get(args, "from")}
            # A preload reads a year of Mifos and writes it all: seconds on demo's, so Cloud Run's 300 is room enough
            timeout: 300
          result: result
        retry:
          predicate: ${is_retryable_read}
          max_retries: 2
          backoff: { initial_delay: 10, max_delay: 60, multiplier: 3 }
    - log:
        call: sys.log
        args:
          severity: INFO
          json: { message: '${args.kind + " sync done"}', execution_id: '${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}', result: '${result}' }
    - done:
        return: ${result}
