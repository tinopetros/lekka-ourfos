main:
  params: [args]
  steps:
    - init:
        assign:
          # Null when the trigger couldn't clean the form: invalid says why, and the run only hands over
          - requisition: ${default(map.get(args, "requisition"), null)}
          - invalid: ${default(map.get(args, "invalid"), null)}
          # The form's payload as posted, beside the clean one while the cleaner is new (phase 5 ADR 2)
          - raw: ${default(map.get(args, "raw"), null)}
          - simulate: {}
    - allow_simulate:
        switch:
          # Dev only. In prod a fixture's simulate is ignored, so the run is a real one
          - condition: ${sys.get_env("SIMULATE") == "on"}
            assign:
              - simulate: ${default(map.get(args, "simulate"), simulate)}
    - log_start:
        call: sys.log
        args:
          severity: INFO
          json: { message: "requisition started", execution_id: '${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}', response_number: '${if(requisition == null, null, requisition.response_number)}' }
    - run:
        try:
          call: process
          args:
            requisition: ${requisition}
            invalid: ${invalid}
            raw: ${raw}
            simulate: ${simulate}
          result: result
        except:
          as: e
          steps:
            - failed:
                call: complete
                args:
                  result: { status: "failed", reason: '${default(map.get(e, "message"), json.encode_to_string(e))}' }
            - fail:
                raise: ${e}
    - complete:
        call: complete
        args:
          result: ${result}
    - done:
        return: ${result}

# Every step, and how it ends: done, rejected or handed over. Only a failed handover raises
process:
  params: [requisition, invalid, raw, simulate]
  steps:
    - init:
        assign:
          - execution_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
          - thread: null
    - run:
        try:
          steps:
            - cleaned:
                switch:
                  - condition: ${requisition == null}
                    raise: { tags: [Invalid], message: '${"The form could not be read: " + invalid}' }
            - receive:
                try:
                  call: call_service
                  args:
                    method: POST
                    path: ""
                    body:
                      requisition: ${requisition}
                      raw: ${raw}
                      simulate: ${simulate}
                      revision: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_REVISION_ID")}
                retry:
                  predicate: ${is_retryable_read}
                  max_retries: 3
                  backoff: { initial_delay: 2, max_delay: 30, multiplier: 2 }
            # The first email. Every other one replies in its thread
            - acknowledge:
                try:
                  call: call_service
                  args:
                    method: POST
                    path: /acknowledge
                    body:
                      simulate: ${map.get(simulate, "acknowledge")}
                  result: thread
                retry:
                  predicate: ${is_transient}
                  max_retries: 3
                  backoff: { initial_delay: 2, max_delay: 30, multiplier: 2 }
            - classify:
                try:
                  call: call_service
                  args:
                    method: POST
                    path: /classify
                    body:
                      simulate: ${map.get(simulate, "classify")}
                    # A real model call can take 40s, and fetching and screening the files adds to it.
                    # Fewer, longer attempts: each one costs
                    timeout: 120
                  result: classification
                retry:
                  predicate: ${is_retryable_read}
                  max_retries: 2
                  backoff: { initial_delay: 4, max_delay: 30, multiplier: 4 }
            - check:
                call: check
                args:
                  c: ${classification}
                  amount: ${requisition.amount}
            - notify:
                try:
                  call: call_service
                  args:
                    method: POST
                    path: /notify
                    body:
                      thread: ${thread}
                      simulate: ${map.get(simulate, "notify")}
                retry:
                  predicate: ${is_transient}
                  max_retries: 3
                  backoff: { initial_delay: 2, max_delay: 30, multiplier: 2 }
            - rejected:
                switch:
                  - condition: ${not classification.approve}
                    return: { status: "rejected", reason: "${classification.reason}" }
            - post:
                call: post
                args:
                  reference: ${execution_id}
                  code: ${map.get(simulate, "mifos_post")}
                result: mifos_transaction_id
            - read_back:
                try:
                  call: call_service
                  args:
                    method: GET
                    path: ${"/read-back/" + mifos_transaction_id}
                    query:
                      simulate: ${default(map.get(simulate, "mifos_read"), "")}
                  result: entry
                retry:
                  predicate: ${is_retryable_read}
                  max_retries: 3
                  backoff: { initial_delay: 2, max_delay: 30, multiplier: 2 }
            - verify:
                switch:
                  - condition: ${len(entry.lines) != len(classification.debit) + len(classification.credit)}
                    raise:
                      tags: [Unconfirmed]
                      message: ${"Posted as " + mifos_transaction_id + " but the read-back has " + string(len(entry.lines)) + " lines. Please check it by hand"}
            - confirm:
                try:
                  call: call_service
                  args:
                    method: POST
                    path: /confirm
                    body:
                      mifos_transaction_id: ${mifos_transaction_id}
                      simulate: ${map.get(simulate, "confirm")}
                retry:
                  predicate: ${is_transient}
                  max_retries: 3
                  backoff: { initial_delay: 2, max_delay: 30, multiplier: 2 }
            - done:
                return: { status: "done", mifos_transaction_id: "${mifos_transaction_id}" }
        except:
          as: e
          steps:
            - handover:
                call: handover
                args:
                  e: ${e}
                  thread: ${thread}
                  requisition: ${requisition}
                  raw: ${raw}
                  code: ${map.get(simulate, "notify")}
                result: reason
            - handed_over:
                return: { status: "handed_over", reason: "${reason}" }

# Every HTTP call, all to this workflow's service: OIDC, a timeout, the execution id, and where it failed.
# Retries are the caller's call
call_service:
  params: [method, path, body: null, query: null, timeout: 20]
  steps:
    - request:
        try:
          call: http.request
          args:
            method: ${method}
            url: ${sys.get_env("SERVICES_URL") + "/requisitions/" + sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID") + path}
            auth:
              type: OIDC
              audience: ${sys.get_env("SERVICES_URL")}
            headers:
              X-Execution-Id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
            body: ${body}
            query: ${query}
            timeout: ${timeout}
          result: response
        except:
          as: e
          steps:
            - add_where:
                assign:
                  - e.at: ${method + " " + path}
            # The service's own reason, e.g. which file couldn't be fetched, so the handover says it
            - add_detail:
                switch:
                  - condition: ${get_type(map.get(e, "body")) == "map"}
                    steps:
                      - detail:
                          switch:
                            - condition: ${get_type(map.get(e.body, "detail")) == "string"}
                              assign:
                                - e.message: '${e.message + ": " + e.body.detail}'
            - rethrow:
                raise: ${e}
    - ok:
        return: ${response.body}

# Approved, balanced and adding up to the amount, or rejected with a reason. Anything else is ours to hand over
check:
  params: [c, amount]
  steps:
    - rejected:
        switch:
          - condition: ${not c.approve and default(map.get(c, "reason"), "") != ""}
            return: ok
          - condition: ${not c.approve}
            raise: { tags: [CheckFailed], message: "Rejected without a reason" }
          - condition: ${len(c.debit) == 0}
            raise: { tags: [CheckFailed], message: "Approved with no entries" }
    - init:
        assign:
          - debits: 0
          - credits: 0
    - sum_debits:
        for:
          value: line
          in: ${c.debit}
          steps:
            - add_debit:
                assign:
                  - debits: ${debits + line.amount}
    - sum_credits:
        for:
          value: line
          in: ${c.credit}
          steps:
            - add_credit:
                assign:
                  - credits: ${credits + line.amount}
    - balanced:
        switch:
          - condition: ${math.abs(debits - credits) > 0.005}
            raise:
              tags: [CheckFailed]
              message: ${"Debits (" + string(debits) + ") and credits (" + string(credits) + ") do not balance"}
          # A cent either way, since the NSSA split rounds each half up. The rest is float noise
          - condition: ${math.abs(debits - amount) > 0.011}
            raise:
              tags: [CheckFailed]
              message: ${"Debits (" + string(debits) + ") do not add up to the requisition's " + string(amount)}
    - ok:
        return: ok

# Only a connection that never got there is retried. A timeout may have landed, so never retry it blind
post:
  params: [reference, code: null]
  steps:
    - send:
        try:
          try:
            call: call_service
            args:
              method: POST
              path: /post
              body:
                simulate: ${code}
            result: posted
          retry:
            predicate: ${is_connection_failed}
            max_retries: 3
            backoff: { initial_delay: 2, max_delay: 30, multiplier: 2 }
        except:
          as: e
          steps:
            - uncertain:
                switch:
                  - condition: ${"TimeoutError" in default(map.get(e, "tags"), [])}
                    raise:
                      tags: [PostUncertain]
                      message: ${"Mifos did not answer in time and the entry may have landed. Check reference " + reference + " before booking it again"}
            - rethrow:
                raise: ${e}
    - posted:
        return: ${posted.mifos_transaction_id}

# The one place every failure ends up: a reply, or a new email when there's no thread yet. If this fails too, the
# execution goes red
handover:
  params: [e, thread, requisition, raw, code: null]
  steps:
    - reason:
        assign:
          - reason: ${default(map.get(e, "message"), json.encode_to_string(e))}
    - where:
        switch:
          - condition: ${map.get(e, "at") != null}
            assign:
              - reason: '${e.at + ": " + reason}'
    - log:
        call: sys.log
        args:
          severity: WARNING
          json: { message: "handing over", execution_id: '${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}', reason: "${reason}" }
    - send:
        try:
          try:
            call: call_service
            args:
              method: POST
              path: /handover
              # Everything it needs, so it doesn't need the database. raw only when there's no requisition
              body:
                thread: ${thread}
                error: ${reason}
                requisition: ${requisition}
                raw: ${if(requisition == null, raw, null)}
                simulate: ${code}
          retry:
            predicate: ${is_transient}
            max_retries: 3
            backoff: { initial_delay: 2, max_delay: 30, multiplier: 2 }
        except:
          as: notify_error
          steps:
            - log_failed:
                call: sys.log
                args:
                  severity: ERROR
                  json: { message: "handover email failed", execution_id: '${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}', reason: "${reason}", error: "${notify_error}" }
            - fail:
                raise: ${notify_error}
    - done:
        return: ${reason}

# Best effort: a run that ended stays ended, even if we can't write it down
complete:
  params: [result]
  steps:
    - write:
        try:
          try:
            call: call_service
            args:
              method: POST
              path: /complete
              body: ${result}
          retry:
            predicate: ${is_transient}
            max_retries: 2
            backoff: { initial_delay: 2, max_delay: 30, multiplier: 2 }
        except:
          as: e
          steps:
            - log:
                call: sys.log
                args:
                  severity: ERROR
                  json: { message: "not completed", execution_id: '${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}', error: "${e}" }

is_transient:
  params: [e]
  steps:
    - tags:
        assign:
          - tags: ${default(map.get(e, "tags"), [])}
    - decide:
        return: ${default(map.get(e, "code"), 0) in [429, 502, 503, 504] or "ConnectionError" in tags or "ConnectionFailedError" in tags}

# Reads and classify have no side effects, so a timeout is safe to retry too
is_retryable_read:
  params: [e]
  steps:
    - timeout:
        switch:
          - condition: ${"TimeoutError" in default(map.get(e, "tags"), [])}
            return: true
    - transient:
        call: is_transient
        args:
          e: ${e}
        result: transient
    - decide:
        return: ${transient}

is_connection_failed:
  params: [e]
  steps:
    - decide:
        return: ${"ConnectionFailedError" in default(map.get(e, "tags"), [])}
