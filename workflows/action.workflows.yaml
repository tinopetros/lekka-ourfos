# What a person does to a submission from the UI: done, approve, disapprove or comment. Side effects first, then the
# record, so nothing is kept that didn't happen: a requisition disapproved has its live entry reversed in Mifos, then
# the thread is told, then the action is kept. Its record is actions/<execution id>, and the UI asks this execution
# how it went. A reversal is a run on the submission too, as a correction's is. Its plumbing is lib.workflows.yaml's.
#
# Started by ourfos-api, with: form; id, the submission; kind; by, an email, and by_name; comment; files, gs:// refs;
# and transaction_id, a requisition's live entry, when disapproving one reverses it

main:
  params: [args]
  steps:
    - init:
        assign:
          - at: '${"/forms/" + args.form + "/" + args.id}'
          - asked:
              kind: ${args.kind}
              by: ${args.by}
              by_name: ${map.get(args, "by_name")}
              comment: ${args.comment}
              files: ${default(map.get(args, "files"), [])}
    - log_start:
        call: sys.log
        args:
          severity: INFO
          json:
            {
              message: "action started",
              execution_id: '${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}',
              at: "${at}",
              kind: "${args.kind}",
            }
    - has_entry:
        switch:
          - condition: ${map.get(args, "transaction_id") == null}
            next: tell
    # As a correction with no lines, under this execution: its run reversed, or failed and why
    - start_reversal:
        call: call_service
        args:
          at: ${at}
          method: POST
          path: /correction
          body:
            reason: ${args.comment}
            requested_by: ${args.by}
            transaction_id: ${args.transaction_id}
            workflow: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_ID")}
            revision: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_REVISION_ID")}
    - reverse:
        try:
          call: post
          args:
            at: ${at}
            run: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
            path: /correction/reverse
          result: reversal
        except:
          as: e
          steps:
            - not_reversed:
                call: complete
                args:
                  at: ${at}
                  result:
                    {
                      status: "failed",
                      reason: '${default(map.get(e, "message"), json.encode_to_string(e))}',
                    }
            - stop:
                raise: ${e}
    - reversed:
        call: complete
        args:
          at: ${at}
          result: { status: "reversed" }
    - say_reversed:
        assign:
          - asked.reversal: { entry: "${args.transaction_id}", by: "${reversal.mifos_transaction_id}" }
    # Raised if it can't go: the execution fails and nothing is recorded
    - tell:
        try:
          call: call_service
          args:
            at: ${at}
            method: POST
            path: /action/email
            body: ${asked}
          result: sent
        retry:
          predicate: ${is_transient}
          max_retries: 3
          backoff: { initial_delay: 2, max_delay: 30, multiplier: 2 }
    # An assign, since an expression can't hold a map literal
    - add_email:
        assign:
          - asked.email: ${sent}
    - record:
        try:
          call: call_service
          args:
            at: ${at}
            method: POST
            path: /action/record
            body: ${asked}
        retry:
          predicate: ${is_transient}
          max_retries: 5
          backoff: { initial_delay: 2, max_delay: 30, multiplier: 2 }
    - done:
        return: { status: "${args.kind}" }
