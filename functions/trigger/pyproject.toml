[project]
name = "trigger"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "functions-framework>=3.10.2",
    "google-cloud-workflows>=1.23.0",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# submission.py, requisition.py and forms.py live in services/. make package copies them next to main.py
pythonpath = [".", "../../services"]
